<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Entscheidsuche">
  <desc>Balance scale — Swiss court decisions</desc>
  <!-- Square field in a judicial navy, deliberately NOT Fedlex's red: the two Swiss legal
       integrations sit next to each other in the plugin list and must stay tellable apart.
       The mark is ours — the service has no wordmark or logo of its own, only a generic
       magnifier favicon — see ATTRIBUTION.md before replacing it with anything that could
       read as their brand or as an official emblem. -->
  <rect width="320" height="320" fill="#1E3A5F"/>
  <g fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- Beam and post -->
    <path d="M64 108 H256"/>
    <path d="M160 92 V238"/>
    <!-- Foot -->
    <path d="M116 250 H204"/>
    <!-- Hangers -->
    <path d="M92 108 V150"/>
    <path d="M228 108 V150"/>
    <!-- Pans: shallow bowls, so the mark still reads as a balance at 20 px -->
    <path d="M58 150 A34 34 0 0 0 126 150"/>
    <path d="M194 150 A34 34 0 0 0 262 150"/>
  </g>
  <!-- Fulcrum knob, filled so the centre holds at small sizes -->
  <circle cx="160" cy="88" r="14" fill="#fff"/>
</svg>
