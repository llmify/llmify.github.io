<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umgezogen | LLMify</title>
  <!-- Alte Adresse, der Inhalt steht jetzt anderswo. GitHub Pages kann keine
       301 senden; canonical plus Refresh ist der Ersatz. Kein noindex, das
       würde die Zusammenführung auf die neue Adresse verhindern. -->
  <link rel="canonical" href="https://llmify.ch/#agent">
  <meta http-equiv="refresh" content="0; url=/#agent">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 28px; text-align: center;
      font: 400 1rem/1.6 system-ui, sans-serif;
      color: #1a1a1a; background: #fff;
    }
    a { color: #1a1a1a; }
  </style>
</head>
<body>
  <p>Diese Seite ist umgezogen. Der Inhalt steht jetzt unter
     <a href="/#agent">Kontexus</a>.</p>
</body>
</html>
