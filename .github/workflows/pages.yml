name: Deploy to GitHub Pages

# Ersetzt den von GitHub erzeugten Workflow «pages-build-deployment». Der bot
# keinen Knopf, ein Deployment ohne neuen Commit zu wiederholen; dieser hat
# workflow_dispatch.

on:
  push:
    branches: [main]
  # Manuell auslösbar: in der Actions-Ansicht «Run workflow» oder
  # `gh workflow run pages.yml`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit. cancel-in-progress bleibt aus: ein laufendes
# Deployment wird nicht abgebrochen, weil ein neues kommt.
concurrency:
  group: pages
  cancel-in-progress: false

# Zwei Jobs, nicht einer. Im selben Job fragte das Deployment die Liste der
# Artefakte eine halbe Sekunde nach dem Hochladen ab und bekam gelegentlich
# «0 Artefakte» zurück, obwohl das Hochladen gelungen war (24., 26. und
# 27.11.2026). Der zweite Job startet auf einer neuen Maschine, bis dahin ist
# das Artefakt in der Liste.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      # Die Seite ist fertig gebaut im Repo — kein Jekyll, kein Build-Schritt.
      # Das Wurzelverzeichnis wird unverändert hochgeladen; .git, .github und
      # Dateien, die mit einem Punkt beginnen, lässt die Action weg.
      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Millisekunden. Zehn Minuten sind das Maximum, das die Action
          # annimmt; einen höheren Wert kürzt sie mit einer Warnung darauf.
          timeout: 600000
