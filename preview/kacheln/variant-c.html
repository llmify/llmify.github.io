:root {
  --bg:#fbfbfa; --panel:#ffffff;
  --line:rgba(20,24,34,.13); --line-soft:rgba(20,24,34,.08);
  --text:#1c1e24; --muted:#5b6270; --faint:#9096a1;
  --accent:#3674d9; --accent-2:#7454e0;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --display:"Space Grotesk",var(--font);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:18px;
  /* Kontexus app tokens (core/client/src/app/globals.css, light theme) */
  --app:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --k-main:#f7f7f7; --k-bubble:#ececec; --k-line:#e5e5e5; --k-ink:#0d0d0d; --k-mut:#6e6e6e; --k-faint:#9b9b9b;
  --k-control:#e9e9e9; --k-accent:#6B9FFF;
  --t:66px; --gap:10px;
}
*,*::before,*::after { box-sizing: border-box; }
html,body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
::selection { background: var(--accent); color: #fff; }

/* ---------- Hero frame ---------- */
.hero { position: relative; overflow: hidden; overflow: clip; min-height: 680px; height: 100vh; isolation: isolate; }
/* large screens: text and window grow in steps, so they do not sit small in the middle
   of a wide wall (zoom scales layout and text together; the tiles size themselves) */
@media (min-width: 1800px) and (min-height: 1000px) { .hero__inner { zoom: 1.12; } }
@media (min-width: 2200px) and (min-height: 1150px) { .hero__inner { zoom: 1.25; } }
@media (min-width: 2800px) and (min-height: 1400px) { .hero__inner { zoom: 1.45; } }

/* ---------- Wall: flat, facing the viewer ---------- */
.wall { position: absolute; inset: 0; z-index: 0; }
.wall__grid { position: absolute; display: grid; gap: var(--gap); grid-auto-rows: var(--t); }
.cell { width: var(--t); height: var(--t); position: relative; }
.wall__grid, .cell { pointer-events: none; }
.cell--empty { border-radius: 22%; border: 1px solid rgba(20,24,34,.06); background: rgba(255,255,255,.4); overflow: hidden;
  opacity: var(--o, 1); transition: opacity .6s ease; }

.tile {
  all: unset; box-sizing: border-box; display: block; cursor: pointer; pointer-events: auto;
  width: var(--t); height: var(--t); position: relative; border-radius: 22%;
  /* the wall is flat; only a single tile tilts, with its own perspective */
  transform: perspective(520px) translate3d(0, var(--y, 0px), var(--z, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1));
  transition: transform .55s cubic-bezier(.2,.7,.2,1);
}
.tile.is-tracking { transition: transform .16s ease-out; }
.tile__face {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  background: #fff;
  border: 1px solid rgba(20,24,34,.09);
  box-shadow: 0 1px 2px rgba(20,24,34,.05), 0 8px 18px -12px rgba(20,24,34,.3);
  display: grid; place-items: center;
  transition: opacity .6s ease, box-shadow .35s ease;
}
/* glyph logos: centred on the white tile, with room around them */
.tile__face img { width: 58%; height: 58%; object-fit: contain; display: block; }
/* square logos bring their own plate: they fill the tile to the edge */
.tile--sq .tile__face { background: transparent; border: 0; box-shadow: 0 1px 2px rgba(20,24,34,.08), 0 8px 18px -12px rgba(20,24,34,.35); }
.tile--sq .tile__face img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.tile--flag .tile__face { background: transparent; border: 0; }
.tile__face svg.flag { width: 100%; height: 100%; display: block; }
/* the lit state: a ring drawn outside the tile edge (box-shadow of a layer the size of
   the tile), so it hugs the logo with no gap between logo and ring */
.tile::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px rgba(54,116,217,.13), 0 16px 30px -12px rgba(54,116,217,.5);
  opacity: 0; transition: opacity .5s ease;
}
/* hover: the tile lifts toward the viewer and casts a deeper shadow */
.tile:hover, .tile:focus-visible { --y: -3px; --z: 14px; z-index: 3; }
.tile:hover .tile__face, .tile:focus-visible .tile__face { box-shadow: 0 2px 4px rgba(20,24,34,.08), 0 22px 30px -14px rgba(20,24,34,.45); }
.tile:hover::before { opacity: .45; }
.tile:focus-visible { outline: none; }
.tile:focus-visible::before { opacity: 1; }

/* the light sweep: only on the tiles of the running example. It starts when they light
   up (display none -> block restarts the animation) and passes again every 4.5 s,
   staggered by position so it travels across the lit tiles */
.gloss {
  position: absolute; top: -20%; bottom: -20%; left: 0; width: 60%; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.22) 40%, rgba(255,255,255,.5) 50%, rgba(255,255,255,.22) 60%, rgba(255,255,255,0) 100%);
  transform: translateX(-170%) skewX(-18deg);
  display: none;
}
.tile.is-case .gloss {
  display: block;
  animation: gloss 4.5s cubic-bezier(.45,.05,.55,.95) infinite;
  animation-delay: calc(var(--d, 0) * .4ms + 250ms);
}
@keyframes gloss {
  0%   { transform: translateX(-170%) skewX(-18deg); }
  30%  { transform: translateX(270%) skewX(-18deg); }
  100% { transform: translateX(270%) skewX(-18deg); }
}

/* a running example: its tiles light up together and stay lit, the rest steps back */
/* the rest fades to about a third and loses most of its colour; --fade-o and --fade-g
   are the values of the «Abblenden» control */
.tile__face { filter: grayscale(0); transition: opacity .6s ease, filter .6s ease, box-shadow .35s ease; }
.wall.is-running .tile:not(.is-case):not(.tile--flag) .tile__face { opacity: var(--fade-o, .15); filter: grayscale(var(--fade-g, 1)); }
/* a hovered or focused tile shows in full, even while faded (same specificity plus :hover) */
.wall.is-running .tile:not(.is-case):not(.tile--flag):hover .tile__face,
.wall.is-running .tile:not(.is-case):not(.tile--flag):focus-visible .tile__face { opacity: 1; filter: grayscale(0); }
.wall.is-running .cell--empty { opacity: calc(var(--o, 1) * .75); }
.tile.is-case { --y: -3px; --s: 1.06; z-index: 2; }
.tile.is-case::before { opacity: 1; }
.tile.is-case .tile__face { box-shadow: 0 1px 2px rgba(20,24,34,.06), 0 12px 24px -12px rgba(20,24,34,.35); }
.tile.is-case:hover .tile__face { box-shadow: 0 2px 4px rgba(20,24,34,.08), 0 22px 30px -14px rgba(20,24,34,.45); }

/* bottom edge fade */
.veil { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(to bottom, rgba(251,251,250,0) calc(100% - 36px), var(--bg) 100%); }

/* ---------- Content layer ---------- */
.hero__inner {
  position: relative; z-index: 2; height: 100%; max-width: 1320px; margin: 0 auto;
  padding: 64px 56px; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(480px, 560px);
  gap: 96px; align-items: center; pointer-events: none;
}
.copy, .screen { pointer-events: auto; }
.copy { max-width: 470px; margin-left: clamp(0px, 2.5vw, 48px); }   /* a little right of the column start, so tiles have room on its left */
.copy h1 { margin: 0; font-weight: inherit; }
.logo { width: min(290px, 100%); height: auto; display: block; margin: 0 0 34px; overflow: visible; }
.kx-arm  { stroke-dasharray: 18; stroke-dashoffset: 0; }
.kx-dot  { transform-box: fill-box; transform-origin: center; }
.kx-glow { opacity: 0; transform-box: fill-box; transform-origin: center; }
.kx-spark { opacity: 0; }
.tagline { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 3.4vw, 2.9rem); line-height: 1.07; letter-spacing: -0.03em; margin: 0 0 18px; text-wrap: balance; }
.grad { background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 45%, var(--accent) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 1.125rem; line-height: 1.55; color: var(--muted); margin: 0 0 32px; max-width: 440px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; border-radius: 13px; padding: 14px 28px; font: 600 1rem/1 var(--font); text-decoration: none; transition: background-color .2s ease, border-color .2s ease; }
.btn--primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(20,24,34,.1), 0 8px 24px -12px rgba(54,116,217,.5); }
.btn--primary:hover { background: #2d66c6; }
.btn--ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
.btn--ghost:hover { border-color: rgba(54,116,217,.45); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn svg { width: 16px; height: 16px; }

/* ---------- Screen: the Kontexus chat ---------- */
.screen { position: relative; }
.frame { background: var(--k-main); border: 1px solid rgba(20,24,34,.12); border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 30px 80px -32px rgba(20,24,34,.28), 0 12px 36px -18px rgba(20,24,34,.12); }
.chrome { display: flex; align-items: center; gap: 7px; padding: 11px 16px; background: #fff; border-bottom: 1px solid var(--k-line); }
.chrome i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #dcdcdc; }
.chrome .url { margin: 0 auto; transform: translateX(-18px); font: 500 12px/1 var(--app); color: var(--k-mut); background: var(--k-main); border-radius: 8px; padding: 6px 44px; }

.stagebody { position: relative; height: 420px; font-family: var(--app); color: var(--k-ink); }
.layer { position: absolute; inset: 0; padding: 14px 22px 10px; display: flex; flex-direction: column; opacity: 0; transition: opacity .5s ease; }
.layer.is-in { opacity: 1; }
.layer.is-probe { visibility: hidden; bottom: auto; opacity: 1; transition: none; }
.layer__top { font-size: 11.5px; color: var(--k-mut); margin-bottom: 6px; }
/* user message: right, #ececec, 16px on every corner (Message.tsx) */
.prompt { align-self: flex-end; max-width: 92%; background: var(--k-bubble); border-radius: 16px; padding: 9px 14px; font-size: 14.5px; line-height: 1.5; margin-bottom: 14px; }
/* tool steps: one quiet line each, icon column with a hairline between (TimelineRow, .step-row) */
.steps { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.step { position: relative; display: flex; align-items: flex-start; gap: 11px; opacity: 0; transform: translateY(4px); transition: opacity .35s ease, transform .35s ease; }
.step.on { opacity: 1; transform: none; }
/* the hairline to the next step grows only once that step is there */
.step:not(:last-child)::before { content: ""; position: absolute; left: 7px; top: .5rem; bottom: -.625rem; width: 1px; background: var(--k-line);
  transform: scaleY(0); transform-origin: top; transition: transform .35s ease; }
.step.on:has(+ .step.on)::before { transform: none; }
.step__mk { position: relative; z-index: 1; width: 15px; flex: none; display: flex; justify-content: center; padding: 2px 0 3px; background: var(--k-main); }
.step__mk img, .step__mk svg.gi { width: 16px; height: 16px; border-radius: 3px; display: block; transition: opacity .2s ease; }
.step__mk svg.gi { color: var(--k-mut); }
/* working indicator: the Kontexus mark beating as in the app (globals.css, kx-mark--working):
   a quarter turn over the first two thirds while the arms flare and the core swells */
.spin { position: absolute; left: 50%; top: 2px; width: 15px; height: 15px; margin-left: -7.5px; opacity: 0; }
.spin svg { width: 15px; height: 15px; display: block; overflow: visible; }
.step.running .spin { opacity: 1; }
.step.running .step__mk img, .step.running .step__mk svg.gi { opacity: 0; }
.kxm__spin { transform-box: view-box; transform-origin: 0 0; }
.kxm__core { transform-box: fill-box; transform-origin: center; }
.step.running .kxm__spin, .step.running .kxm__arm, .step.running .kxm__core {
  animation-duration: .85s; animation-timing-function: cubic-bezier(.65,0,.35,1); animation-iteration-count: infinite; }
.step.running .kxm__spin { animation-name: kxTurn; }
.step.running .kxm__arm { animation-name: kxFlare; }
.step.running .kxm__core { animation-name: kxCore; }
@keyframes kxTurn { 0% { transform: rotate(0deg); } 65%, 100% { transform: rotate(90deg); } }
@keyframes kxFlare { 0%, 65%, 100% { transform: translate(0, 0); } 32% { transform: translate(var(--ox), var(--oy)); } }
@keyframes kxCore { 0%, 65%, 100% { transform: scale(1); } 32% { transform: scale(1.25); } }
/* the answer streams in: word groups fade in one after another */
.result .w { opacity: 0; transition: opacity .28s ease; }
.result .w.on { opacity: 1; }
.step__txt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.4; color: var(--k-mut); }
.step__d { display: block; font-size: 12.5px; color: var(--k-faint); margin-top: 1px; }
.step.running .step__t {
  --sb: color-mix(in srgb, #6e6e6e 70%, #f7f7f7);
  background: linear-gradient(90deg, var(--sb) 0%, var(--sb) 30%, var(--k-ink) 50%, var(--sb) 70%, var(--sb) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { 0% { background-position: 125% 0; } 100% { background-position: -25% 0; } }
/* assistant answer: plain text at the left edge, no avatar, no name */
.result { font-size: 14.5px; line-height: 1.65; margin: 0; opacity: 0; transform: translateY(4px); transition: opacity .4s ease, transform .4s ease; }
.result b { font-weight: 700; }
/* approval card, simplified (Approvals/ApprovalFrame.tsx) */
.ask { margin-top: 12px; background: #fff; border: 1px solid var(--k-line); border-radius: 18px; box-shadow: 0 8px 28px rgba(0,0,0,.07); overflow: hidden;
  opacity: 0; transform: translateY(6px); transition: opacity .4s ease .2s, transform .4s ease .2s; }
.ask__head { display: flex; align-items: center; gap: 11px; padding: 11px 14px 10px; }
.ask__ic { width: 30px; height: 30px; border-radius: 8px; flex: none; object-fit: contain; }
.ask__ic.gl { padding: 4px; background: #fff; border: 1px solid var(--k-line); }
.ask__q { font-size: 14px; font-weight: 600; line-height: 1.3; }
.ask__h { font-size: 12px; color: var(--k-mut); margin-top: 1px; }
.ask__foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--k-line); }
.ask__foot .sp { flex: 1; }
.pb { display: inline-flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.pb--ghost { color: var(--k-mut); }
.pb--dark { background: var(--k-ink); color: #fff; }
.layer.show-result .result, .layer.show-ask .ask { opacity: 1; transform: none; }
.layer.is-probe .ask { opacity: 1; }
/* composer: the white pill with hairline and soft shadow (InputArea.tsx, composerSurface.ts) */
.composer { margin: 0 18px 14px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 8px; background: #fff;
  border: .5px solid rgba(13,13,13,.09); border-radius: 23px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.045); font-family: var(--app); }
.composer__btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--k-mut); }
.composer__btn svg { width: 17px; height: 17px; }
.composer__ph { flex: 1; font-size: 14px; color: var(--k-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer__send { background: var(--k-control); color: var(--k-ink); }
.composer__send svg { opacity: .4; width: 16px; height: 16px; }

/* case picker under the screen: removed at the user's request; the tiles start cases */
.picker { display: none !important; }
.picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px auto 0; padding: 6px; width: fit-content; max-width: 100%;
  background: rgba(255,255,255,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line-soft); border-radius: 14px; }
.picker button { all: unset; cursor: pointer; position: relative; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 6px 11px; border-radius: 9px; transition: color .2s ease, background-color .2s ease; }
.picker button:hover { color: var(--text); background: rgba(20,24,34,.045); }
.picker button[aria-current="true"] { color: var(--accent); background: rgba(54,116,217,.09); }
.picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- Info card ---------- */
.tip { position: fixed; left: 0; top: 0; z-index: 50; width: 270px; pointer-events: none;
  background: rgba(255,255,255,.95); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 14px 36px -14px rgba(20,24,34,.28);
  opacity: 0; transform: translate3d(var(--tx,0), calc(var(--ty,0) + 6px), 0); transition: opacity .2s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
.tip.is-on { opacity: 1; transform: translate3d(var(--tx,0), var(--ty,0), 0); }
.tip__title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.tip__title img, .tip__title svg { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; }
.tip__text { font-size: 13px; line-height: 1.5; color: var(--muted); }
.tip__hint { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--accent); }
.tip__hint:empty { display: none; }

/* ---------- Narrower desktops ---------- */
@media (max-width: 1180px) {
  .hero__inner { gap: 56px; padding: 56px 40px; grid-template-columns: minmax(300px, 1fr) minmax(440px, 520px); }
}
@media (max-width: 960px) and (min-width: 761px) {
  .hero__inner { grid-template-columns: 1fr 1fr; gap: 36px; padding: 56px 28px; }
  .picker { gap: 2px; padding: 4px; }
  .picker button { padding: 6px 8px; font-size: 12px; }
}

/* ---------- Mobile (and phones in landscape): one screen, no scrolling ----------
   The hero is exactly the visible height: the text, a small symbolic example card in
   place of the chat window, and under it one band of tiles (two rows; landscape: one
   row across both columns), only the connectors of the featured cases plus the Swiss
   tile. Everything here applies to phones only. */
.mcard { display: none; }
@media (max-width: 760px), (max-height: 500px) and (orientation: landscape) {
  :root { --t: 38px; --gap: 10px; }
  .hero { height: 100vh; height: 100svh; min-height: 540px; max-height: none; }
  .hero__inner { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: clamp(14px, 3.4svh, 34px);
    height: 100%; max-width: 560px; padding: 16px; }
  .copy { max-width: none; margin-left: 0; }
  .logo { width: 160px; margin-bottom: clamp(10px, 2.2svh, 20px); }
  .tagline { font-size: 1.75rem; line-height: 1.1; margin-bottom: 10px; }
  .sub { font-size: .95rem; line-height: 1.5; margin-bottom: clamp(14px, 2.6svh, 24px); }
  .ctas { gap: 8px; }
  .btn { flex: 1 1 auto; justify-content: center; min-height: 44px; padding: 11px 14px; font-size: .9375rem; white-space: nowrap; }
  .frame, .picker, .veil, .tune { display: none !important; }

  /* the two bands of tiles */
  /* the wall moves into the content column (script) and sits under the card as one band */
  .wall { position: relative; inset: auto; flex: none; z-index: auto; }
  .wall__grid.is-bands { position: static; display: flex; flex-direction: column; align-items: center; gap: var(--gap); }
  .band { display: flex; justify-content: center; gap: var(--gap); }
  /* a larger hit area than the tile itself, but no larger than half the gap */
  .band .tile::after { content: ""; position: absolute; inset: calc(var(--gap) / -2); }
  .band .tile::before { box-shadow: 0 0 0 2px var(--accent), 0 0 0 5px rgba(54,116,217,.13), 0 10px 20px -10px rgba(54,116,217,.5); }
  .band .tile__face { box-shadow: 0 1px 2px rgba(20,24,34,.06), 0 5px 12px -8px rgba(20,24,34,.3); }

  /* the symbolic example: prompt, the step icons with a check each, the first sentence of the answer */
  .mcard { display: block; position: relative; flex: none; background: #fff; border: 1px solid rgba(20,24,34,.1); border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 40px -26px rgba(20,24,34,.32), 0 4px 14px -8px rgba(20,24,34,.1); font-family: var(--app); color: var(--k-ink); }
  .mc { position: absolute; inset: 0; padding: 11px 14px 13px; display: flex; flex-direction: column; gap: 9px; opacity: 0; transition: opacity .2s ease; }
  /* the old case fades out quickly, the new one comes in once it is nearly gone */
  .mc.is-in { opacity: 1; transition: opacity .35s ease .15s; }
  .mc.is-probe { visibility: hidden; bottom: auto; opacity: 1; transition: none; }
  .mc__top { margin-left: auto; padding-left: 10px; font-size: 11px; line-height: 1.2; color: var(--k-faint); white-space: nowrap; }
  .mc__prompt { align-self: flex-end; max-width: 94%; background: var(--k-bubble); border-radius: 14px; padding: 7px 12px; font-size: 13.5px; line-height: 1.4;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .mc__steps { display: flex; align-items: center; height: 32px; }
  .mc__step { position: relative; width: 28px; height: 28px; flex: none; opacity: 0; transform: scale(.8); transition: opacity .3s ease, transform .3s cubic-bezier(.2,.7,.2,1); }
  .mc__step.on { opacity: 1; transform: none; }
  .mc__step img, .mc__step svg.gi { width: 100%; height: 100%; display: block; border-radius: 7px; object-fit: contain; }
  .mc__step.gl img, .mc__step svg.gi { padding: 5px; background: #fff; border: 1px solid var(--k-line); color: var(--k-mut); }
  .mc__ok { position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    display: grid; place-items: center; opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
  .mc__ok svg { width: 8px; height: 8px; display: block; }
  .mc__step.done .mc__ok { opacity: 1; transform: none; }
  .mc__link { flex: 0 0 18px; height: 1.5px; margin: 0 7px; border-radius: 1px; background: var(--k-line); opacity: 0; transition: opacity .3s ease; }
  .mc__link.on { opacity: 1; }
  .mc__result { margin: 0; font-size: 13.5px; line-height: 1.45; opacity: 0; transition: opacity .4s ease;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .mc__result b { font-weight: 700; }
  .mc.show-result .mc__result { opacity: 1; }
}
/* touch phones: a tapped tile keeps :hover until the next tap; it must not look lit
   (or unfaded) after the example has moved on. Keyboard focus still shows. */
@media (hover: none) and (max-width: 760px), (hover: none) and (max-height: 500px) and (orientation: landscape) {
  .tile:hover:not(.is-case):not(:focus-visible) { --y: 0px; --z: 0px; }
  .tile:hover:not(.is-case):not(:focus-visible)::before { opacity: 0; }
  .wall.is-running .tile:not(.is-case):not(.tile--flag):hover:not(:focus-visible) .tile__face { opacity: var(--fade-o, .15); filter: grayscale(var(--fade-g, 1)); }
}
/* narrow phones: both buttons still fit side by side */
@media (max-width: 380px) {
  .btn { padding: 11px 12px; font-size: .875rem; }
  .btn--primary svg { display: none; }
}
/* phones in landscape: text left, card right, one thin row of tiles under both */
@media (max-height: 500px) and (orientation: landscape) {
  :root { --t: 34px; }
  .hero { min-height: 320px; }
  .hero__inner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); align-items: center; align-content: center; gap: 28px;
    max-width: 880px; padding: 12px 24px; row-gap: 18px; }
  .wall { grid-column: 1 / -1; }
  .logo { width: 128px; margin-bottom: 8px; }
  .tagline { font-size: 1.45rem; margin-bottom: 8px; }
  .sub { font-size: .875rem; line-height: 1.45; margin-bottom: 12px; }
  .btn { flex: 0 0 auto; min-height: 40px; padding: 9px 16px; font-size: .875rem; }
}

/* ---------- Reduced motion: no movement, fades only ---------- */
@media (prefers-reduced-motion: reduce) {
  .gloss { animation: none; display: none; }
  .tile { transition: none; transform: none !important; }
  .tile:hover .tile__face, .tile:focus-visible .tile__face { box-shadow: 0 1px 2px rgba(20,24,34,.05), 0 8px 18px -12px rgba(20,24,34,.3); }
  .step, .result, .ask { transform: none !important; transition: opacity .3s ease; }
  .spin svg, .step.running .step__t, .step.running .kxm__spin, .step.running .kxm__arm, .step.running .kxm__core { animation: none; }
  .tip { transition: opacity .15s ease; transform: translate3d(var(--tx,0), var(--ty,0), 0); }
  .mc__step, .mc__ok { transform: none !important; }
}

/* ---------- Tuning panel (prototype only, remove before going live) ---------- */
.tune { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: 250px; font: 12.5px/1.4 var(--font); color: var(--text);
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--line-soft); border-radius: 12px; box-shadow: 0 14px 36px -14px rgba(20,24,34,.28); }
.tune summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
.tune summary::-webkit-details-marker { display: none; }
.tune summary::after { content: " ▸"; color: var(--faint); }
.tune[open] summary::after { content: " ▾"; }
.tune__body { padding: 0 14px 12px; display: grid; gap: 10px; }
.tune label { display: grid; gap: 4px; }
.tune .row { display: flex; justify-content: space-between; }
.tune output { font-variant-numeric: tabular-nums; color: var(--muted); }
.tune input { width: 100%; accent-color: var(--accent); }
.tune__note { color: var(--faint); font-size: 11.5px; }
@media (max-width: 760px) { .tune { left: 8px; right: 8px; bottom: 8px; width: auto; } .tune__arr { display: none; } }
.tune__arr { border-top: 1px solid var(--line-soft); padding-top: 10px; display: grid; gap: 8px; }
.tune__check { display: flex !important; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.tune__check input { width: auto; }
.tune__btns { display: flex; gap: 6px; }
.tune__btns button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; }
.tune__btns button:hover { border-color: var(--accent); color: var(--accent); }
/* arranging: every cell is a drop target, every tile in full colour, no tilt or tips */
.hero.is-arranging .tile { cursor: grab; }
.hero.is-arranging .tile .tile__face { opacity: 1 !important; filter: none !important; }
.hero.is-arranging .cell--empty { opacity: 1 !important; border-style: dashed; border-color: rgba(54,116,217,.28); }
.tile.is-dragging { z-index: 30; cursor: grabbing; transition: none !important; }
.cell.is-target::after { content: ""; position: absolute; inset: -4px; border: 2px dashed var(--accent); border-radius: 24%; pointer-events: none; z-index: 40; }
</style>

<body>

<section class="hero" id="hero" aria-labelledby="hero-title">
  <div class="hero__inner">

  /* keyboard: the wall is one tab stop, the arrow keys move to the nearest tile in that direction */
  grid.addEventListener('keydown', function (e) {
    var dir = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }[e.key];
    var b = e.target.closest('.tile'); if (!dir || !b) return;
    var r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, next = null, bs = 1e9;
    grid.querySelectorAll('.tile').forEach(function (o) {
      if (o === b) return;
      var q = o.getBoundingClientRect(), dx = q.left + q.width / 2 - x, dy = q.top + q.height / 2 - y;
      var along = dx * dir[0] + dy * dir[1], across = Math.abs(dx * dir[1] + dy * dir[0]);
      if (along < 4) return;
      var sc = along + across * 2.5; if (sc < bs) { bs = sc; next = o; }
    });
    e.preventDefault();
    if (!next) return;
    b.tabIndex = -1; next.tabIndex = 0; next.focus();
  });

  /* ---------------- Init ---------------- */
  var lastMode = null;
  function layout() {
    var m = isStacked();
    sizeBody(); sizeCard(); buildWall();
    /* crossing between phone and desktop: show the running case in the other form */
    if (lastMode !== null && m !== lastMode && current) play(current);
    lastMode = m;
  }
  /* the layout depends on the viewport (the hero's own height is set by the layout on
     phones and when it has to grow), so watch the window, not the hero */
  var rt = 0, lastW = 0, lastH = 0;
  function remember() { lastW = window.innerWidth; lastH = window.innerHeight; }
  function sizeChanged() {
    if (window.innerWidth !== lastW) return true;
    /* on phones the height only changes with the address bar: no new layout for that */
    /* except when the height alone crosses into or out of the phone layout (landscape) */
    if (isStacked() !== lastMode) return true;
    return !window.matchMedia(STACKED).matches && Math.abs(window.innerHeight - lastH) > 2;
  }
  function onResize() {
    clearTimeout(rt); rt = setTimeout(function () {
      if (!sizeChanged()) return;
      remember(); hideTip(); layout();
    }, 120);
  }
  window.addEventListener('resize', onResize);

  /* test hook for headless screenshots: #vh=900 pins the hero height */
  var vhm = /vh=(\d+)/.exec(location.hash);
  if (vhm) pinH = +vhm[1];
  /* tuning panel (prototype only) */
  (function () {
    var f = $('tuneFade'), k = $('tuneSkip'), c = $('tuneCopy'), lt = 0;
    function show() {
      $('tuneFadeV').textContent = Math.round((1 - 0.85 * TUNE.fade) * 100) + ' % · ' + Math.round(TUNE.fade * 100) + ' % grau';
      $('tuneSkipV').textContent = Math.round(TUNE.skip * 100) + ' %';
      $('tuneCopyV').textContent = TUNE.copyPad.toFixed(2) + ' Kacheln';
    }
    if (window.matchMedia(STACKED).matches) $('tune').open = false;
    f.value = TUNE.fade; k.value = TUNE.skip; c.value = TUNE.copyPad; show();
    f.addEventListener('input', function () { TUNE.fade = +f.value; applyFade(); show(); });
    function relay() { clearTimeout(lt); lt = setTimeout(function () { hideTip(); buildWall(); }, 60); }
    k.addEventListener('input', function () { TUNE.skip = +k.value; show(); relay(); });
    c.addEventListener('input', function () { TUNE.copyPad = +c.value; show(); relay(); });
  })();

  /* ---------------- Arranging by hand (prototype tool) ---------------- */
  (function () {
    var on = $('arrOn'), drag = null, target = -1, raf2 = 0, chk = $('chkOn');
    chk.checked = !!TUNE.checker;
    chk.addEventListener('change', function () { TUNE.checker = chk.checked; hideTip(); buildWall(); });
    function cellAt(x, y) {
      var P = lastP, inside = {};
      P.inside.forEach(function (i) { inside[i] = 1; });
      for (var i = 0; i < P.cells.length; i++) {
        if (!inside[i]) continue;
        var r = P.cells[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
      }
      return -1;
    }
    function mark(i) {
      if (target === i) return;
      if (target >= 0) lastP.cells[target].classList.remove('is-target');
      target = i;
      if (i >= 0) lastP.cells[i].classList.add('is-target');
    }
    on.addEventListener('change', function () {
      arranging = on.checked;
      hero.classList.toggle('is-arranging', arranging);
      hideTip();
      arrangeNote(arranging ? 'Kachel auf eine andere Zelle ziehen. Auf einer belegten Zelle tauschen die zwei.' : '');
    });
    grid.addEventListener('pointerdown', function (e) {
      if (!arranging) return;
      var b = e.target.closest('.tile'); if (!b) return;
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      b.classList.add('is-dragging');
      drag = { b: b, x: e.clientX, y: e.clientY, from: b.parentNode };
    });
    grid.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y, px = e.clientX, py = e.clientY;
      drag.b.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.08)';
      if (!raf2) raf2 = requestAnimationFrame(function () { raf2 = 0; if (drag) mark(cellAt(px, py)); });
    });
    function end(e) {
      if (!drag) return;
      var d = drag, t = cellAt(e.clientX, e.clientY);
      drag = null; mark(-1);
      d.b.classList.remove('is-dragging'); d.b.style.transform = '';
      if (t < 0 || lastP.cells[t] === d.from) return;
      var L = currentLayout(), ref = refCol(lastP), cell = lastP.cells[t];
      var to = [cell._r, cell._c - ref], from = L.items[d.b.dataset.icon];
      Object.keys(L.items).forEach(function (icon) {
        var rc = L.items[icon];
        if (rc[0] === to[0] && rc[1] === to[1]) L.items[icon] = from;   /* swap with the tile already there */
      });
      L.items[d.b.dataset.icon] = to;
      saveLayout(L);
      buildWall();
      arrangeNote('Gespeichert in diesem Browser. «Layout kopieren» und mir schicken.');
    }
    grid.addEventListener('pointerup', end);
    grid.addEventListener('pointercancel', end);
    $('arrCopy').addEventListener('click', function () {
      var txt = JSON.stringify(currentLayout());
      var done = function () { arrangeNote('Kopiert (' + txt.length + ' Zeichen). Bitte in den Chat einfügen.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Layout:', txt); });
      else window.prompt('Layout:', txt);
    });
    $('arrReset').addEventListener('click', function () { saveLayout(null); buildWall(); arrangeNote('Wieder automatisch verteilt.'); });
  })();
  applyFade();
  remember();
  sizeBody();
  lastMode = isStacked(); sizeCard();
  play(FEATURED[0]);
  buildWall();
  var fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();
  fontsReady.then(function () { remember(); layout(); });
})();

// Kontexus animated lockup — the "Flow" reveal (port of AnimatedLogo.tsx).
// Arms draw from the outside in, a spark glides along each into the core, the
// dot blooms, then the wordmark settles in. Plays once when it scrolls in.
(function () {
  var svg = document.querySelector('.kx-anim');
  if (!svg || typeof svg.animate !== 'function') return; // no WAAPI -> CSS shows final frame
  var arms = [].slice.call(svg.querySelectorAll('.kx-arm'));
  var sparks = [].slice.call(svg.querySelectorAll('.kx-spark'));
  var dot = svg.querySelector('.kx-dot');
  var glow = svg.querySelector('.kx-glow');
  var words = [].slice.call(svg.querySelectorAll('.kx-word'));
  var ARM_DELAYS = [120, 260, 200, 330];
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = [];

  function A(el, frames, opts) {
    opts.fill = 'both';
    if (!opts.easing) opts.easing = 'cubic-bezier(.4,0,.2,1)';
    var a = el.animate(frames, opts);
    running.push(a);
    return a;
  }

  function play() {
    running.splice(0).forEach(function (a) { a.cancel(); });
    if (reduced) return; // CSS default already is the final frame

    arms.forEach(function (el, i) {
      A(el, [
        { strokeDashoffset: '-18px', opacity: 0 },
        { strokeDashoffset: '-18px', opacity: 1, offset: 0.06 },
        { strokeDashoffset: '0px', opacity: 1 }
      ], { duration: 640, delay: ARM_DELAYS[i], easing: 'cubic-bezier(.3,.6,.15,1)' });
    });

    sparks.forEach(function (el, i) {
      var sx = el.getAttribute('data-sx'), sy = el.getAttribute('data-sy');
      A(el, [
        { transform: 'translate(' + sx + 'px,' + sy + 'px)', opacity: 0 },
        { opacity: 1, offset: 0.14 },
        { opacity: 0.95, offset: 0.8 },
        { transform: 'translate(0px,0px)', opacity: 0 }
      ], { duration: 740, delay: ARM_DELAYS[i], easing: 'cubic-bezier(.5,.05,.3,1)' });
    });

    if (glow) A(glow, [
      { opacity: 0, transform: 'scale(.5)' },
      { opacity: 0.85, offset: 0.35 },
      { opacity: 0, transform: 'scale(1.5)' }
    ], { duration: 700, delay: 1030, easing: 'cubic-bezier(.25,.6,.3,1)' });

    if (dot) A(dot, [
      { opacity: 0, transform: 'scale(.25)' },
      { opacity: 1, offset: 0.45 },
      { transform: 'scale(1.12)', offset: 0.62 },
      { transform: 'scale(1)', opacity: 1 }
    ], { duration: 540, delay: 1030, easing: 'cubic-bezier(.2,.7,.25,1)' });

    if (words[0]) A(words[0], [
      { opacity: 0, transform: 'translateX(9px)' },
      { opacity: 1, transform: 'translateX(0px)' }
    ], { duration: 620, delay: 1160, easing: 'cubic-bezier(.2,.7,.2,1)' });

    if (words[1]) A(words[1], [
      { opacity: 0, transform: 'translateX(-9px)' },
      { opacity: 1, transform: 'translateX(0px)' }
    ], { duration: 620, delay: 1160, easing: 'cubic-bezier(.2,.7,.2,1)' });
  }

  var played = false;
  function start() {
    if (played) return;
    played = true;
    Promise.race([
      (document.fonts && document.fonts.ready) || Promise.resolve(),
      new Promise(function (r) { setTimeout(r, 700); })
    ]).then(function () { requestAnimationFrame(play); });
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { start(); io.disconnect(); }
      });
    }, { threshold: 0.4 });
    io.observe(svg);
  } else {
    start();
  }
})();
</script>
</body>
</html>
