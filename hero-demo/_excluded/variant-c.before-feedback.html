<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontexus – Hero Variante C</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url("../assets/fonts/Inter-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url("../assets/fonts/Inter-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap;
  src: url("../assets/fonts/SpaceGrotesk-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap;
  src: url("../assets/fonts/SpaceGrotesk-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "InterKx"; src: url("../assets/inter-logo.woff2") format("woff2");
  font-weight: 100 900; font-display: swap;
}

:root {
  --bg:#fbfbfa; --panel:#ffffff; --panel-2:rgba(20,24,34,.045);
  --line:rgba(20,24,34,.13); --line-soft:rgba(20,24,34,.08);
  --text:#1c1e24; --muted:#5b6270; --faint:#9096a1;
  --accent:#3674d9; --accent-2:#7454e0; --green:#0f9d8a;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --display:"Space Grotesk",var(--font);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --app:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:18px;
  --a-input:#f4f4f4; --a-line:#e5e5e5; --a-ink:#0d0d0d; --a-mut:#6e6e6e; --a-accent:#6b9fff;
  --t:76px; --gap:12px;
}
*,*::before,*::after { box-sizing: border-box; }
html,body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
::selection { background: var(--accent); color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Hero frame ---------- */
.hero { position: relative; overflow: hidden; min-height: 680px; height: 100vh; max-height: 980px; isolation: isolate; }

/* ---------- Wall ---------- */
.wall { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 60% 40%; z-index: 0; }
.wall__grid {
  position: absolute; display: grid; gap: var(--gap);
  grid-auto-rows: var(--t);
  transform-style: preserve-3d;
  transform: rotateX(5deg) rotateY(-3deg);
  transform-origin: 50% 50%;
}
.cell { width: var(--t); height: var(--t); position: relative; transform-style: preserve-3d; }
/* the rotated grid and the cells lie in the tiles' plane and would win some hit tests; only tiles take the pointer */
.wall__grid, .cell { pointer-events: none; }
.cell--empty { border-radius: 22%; border: 1px solid rgba(20,24,34,.055); background: rgba(255,255,255,.35); overflow: hidden; }

.tile {
  all: unset; box-sizing: border-box; display: block; cursor: pointer; pointer-events: auto;
  width: var(--t); height: var(--t); position: relative; border-radius: 22%;
  transform: translate3d(0,0,calc(var(--z,0px) + 1px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));
  transition: transform .55s cubic-bezier(.2,.7,.2,1);
  will-change: transform;
}
.tile.is-tracking { transition: transform .16s ease-out; }
.tile__face {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  background: linear-gradient(160deg, #ffffff 0%, #f7f8fa 100%);
  border: 1px solid rgba(20,24,34,.1);
  box-shadow: 0 1px 2px rgba(20,24,34,.05), 0 10px 22px -16px rgba(20,24,34,.35);
  display: grid; place-items: center;
  transition: opacity .6s ease;
}
.tile__face img, .tile__face svg.flag { width: 46%; height: 46%; object-fit: contain; display: block; }
.tile__face img.sq { border-radius: 22%; }
.tile__face svg.flag { width: 50%; height: 50%; border-radius: 12%; }
/* the lit state: a ring and soft glow on a separate layer, faded via opacity */
.tile::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  border: 1.5px solid rgba(54,116,217,.55);
  box-shadow: 0 0 0 4px rgba(54,116,217,.1), 0 18px 36px -14px rgba(54,116,217,.55), 0 0 40px -6px rgba(116,84,224,.35);
  opacity: 0; transition: opacity .5s ease;
}
.tile:hover, .tile:focus-visible { --z: 10px; }
.tile:hover::before, .tile:focus-visible::before { opacity: .45; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* idle shimmer: one diagonal sweep across the wall every 10 s */
.gloss {
  position: absolute; top: -20%; bottom: -20%; left: 0; width: 55%; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(120,160,235,.10) 40%, rgba(255,255,255,.95) 50%, rgba(120,160,235,.10) 60%, rgba(255,255,255,0) 100%);
  transform: translateX(-160%) skewX(-18deg);
  animation: gloss 10s cubic-bezier(.45,.05,.35,1) infinite;
  animation-delay: calc(var(--d, 0) * 1ms + 1500ms);
}
.cell--empty .gloss { background: linear-gradient(90deg, rgba(54,116,217,0) 0%, rgba(54,116,217,.07) 50%, rgba(54,116,217,0) 100%); }
@keyframes gloss {
  0%  { transform: translateX(-160%) skewX(-18deg); }
  9%  { transform: translateX(260%) skewX(-18deg); }
  100%{ transform: translateX(260%) skewX(-18deg); }
}

/* running case: lit tiles rise, the rest dims a little */
.wall.is-running .tile:not(.is-case) .tile__face { opacity: .62; }
.wall.is-running .cell--empty { opacity: .8; }
.cell--empty { transition: opacity .6s ease; }
.tile.is-case { --z: 22px; }
.tile.is-case::before { opacity: .6; }
.tile.is-active { --z: 44px; --s: 1.06; }
.tile.is-active::before { opacity: 1; }
.tile.is-case .tile__face, .tile.is-active .tile__face { opacity: 1; }

/* veils over the wall: legibility behind the text, fade at the bottom edge */
.veil { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    radial-gradient(ellipse var(--vw, 30%) var(--vh, 42%) at var(--vx, 22%) var(--vy, 50%), rgba(251,251,250,.96) 0%, rgba(251,251,250,.88) 60%, rgba(251,251,250,0) 100%),
    linear-gradient(to bottom, rgba(251,251,250,0) calc(100% - 36px), var(--bg) 100%);
}

/* ---------- Content layer ---------- */
.hero__inner {
  position: relative; z-index: 2; height: 100%; max-width: 1320px; margin: 0 auto;
  padding: 72px 56px; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(480px, 580px);
  gap: 96px; align-items: center; pointer-events: none;
}
.copy, .screen { pointer-events: auto; }
.copy { max-width: 470px; }
.copy h1 { margin: 0; font-weight: inherit; }
.logo { width: min(330px, 100%); height: auto; display: block; margin: 0 0 30px -4px; }
.kx-word { font-family: "InterKx", Inter, system-ui, sans-serif; font-size: 100px; letter-spacing: -1.5px; font-variation-settings: 'wght' 695, 'opsz' 14; fill: #2A2A2A; }
.kx-arm  { stroke-dasharray: 18; stroke-dashoffset: 0; }
.kx-dot  { transform-box: fill-box; transform-origin: center; }
.kx-glow { opacity: 0; transform-box: fill-box; transform-origin: center; }
.kx-spark { opacity: 0; }
.tagline { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 3.4vw, 2.9rem); line-height: 1.07; letter-spacing: -0.03em; margin: 0 0 18px; text-wrap: balance; }
.grad { background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 45%, var(--accent) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 1.125rem; line-height: 1.55; color: var(--muted); margin: 0 0 32px; max-width: 440px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; border-radius: 13px; padding: 14px 28px; font: 600 1rem/1 var(--font); text-decoration: none; transition: background-color .2s ease, border-color .2s ease, transform .2s ease; }
.btn--primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(20,24,34,.1), 0 8px 24px -12px rgba(54,116,217,.5); }
.btn--primary:hover { background: #2d66c6; }
.btn--primary::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0)); transform: translateX(-150%) skewX(-20deg); transition: transform .7s ease; }
.btn--primary:hover::after { transform: translateX(320%) skewX(-20deg); }
.btn--ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
.btn--ghost:hover { border-color: rgba(54,116,217,.45); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn svg { width: 16px; height: 16px; }

/* ---------- Screen ---------- */
.screen { position: relative; }
.screen__glow { position: absolute; inset: -12% -8%; z-index: -1; pointer-events: none; filter: blur(30px);
  background: radial-gradient(closest-side at 50% 30%, rgba(54,116,217,.1), transparent), radial-gradient(closest-side at 70% 60%, rgba(116,84,224,.06), transparent); }
.frame { background: #fff; border: 1px solid rgba(20,24,34,.12); border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 30px 80px -32px rgba(20,24,34,.28), 0 12px 36px -18px rgba(54,116,217,.14); }
.chrome { display: flex; align-items: center; gap: 7px; padding: 13px 18px; background: rgba(20,24,34,.03); border-bottom: 1px solid var(--line-soft); }
.chrome i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.chrome i:nth-child(1) { background: #f26b6b; } .chrome i:nth-child(2) { background: #f2c94c; } .chrome i:nth-child(3) { background: #6bd08b; }
.chrome .url { margin: 0 auto; transform: translateX(-20px); font-family: var(--mono); font-size: .78rem; color: var(--muted); background: rgba(20,24,34,.04); border: 1px solid var(--line-soft); border-radius: 8px; padding: 4px 44px; }

.stagebody { position: relative; height: 460px; font-family: var(--app); color: var(--a-ink); }
.layer { position: absolute; inset: 0; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity .5s ease; }
.layer.is-in { opacity: 1; }
.layer.is-probe { visibility: hidden; bottom: auto; opacity: 1; transition: none; }
.layer__top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--a-mut); }
.casetag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: rgba(54,116,217,.08); border-radius: 6px; padding: 3px 8px; }
.prompt { align-self: flex-end; max-width: 84%; background: rgba(20,24,34,.045); border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
.agent { display: flex; gap: 10px; align-items: flex-start; }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--a-input); display: grid; place-items: center; flex: none; }
.av svg { width: 14px; height: 14px; }
.agent__body { flex: 1; min-width: 0; }
.agent__name { font-size: 12px; font-weight: 600; margin: 5px 0 7px; }
.steps { position: relative; display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.step { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line-soft); border-radius: 10px; padding: 7px 10px; background: #fff;
  opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease, border-color .35s ease; }
.step.on { opacity: 1; transform: none; }
.step.running { border-color: rgba(54,116,217,.35); }
.step img { width: 20px; height: 20px; object-fit: contain; border-radius: 5px; flex: none; margin-top: 1px; }
.step__txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; }
.step__txt b { display: block; font-weight: 600; color: var(--a-ink); }
.step__txt span { color: var(--a-mut); font-size: 12.5px; }
.st { width: 16px; height: 16px; flex: none; margin-top: 2px; position: relative; }
.st__spin { position: absolute; inset: 2px; border: 1.6px solid rgba(54,116,217,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; transition: opacity .2s ease; }
.st__ok { position: absolute; inset: 0; opacity: 0; transform: scale(.6); transition: opacity .3s ease, transform .3s cubic-bezier(.2,.8,.3,1.3); }
.step.done .st__spin { opacity: 0; animation: none; }
.step.done .st__ok { opacity: 1; transform: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.result { font-size: 13.5px; line-height: 1.55; margin: 0; opacity: 0; transform: translateY(6px); transition: opacity .4s ease, transform .4s ease; }
.result b { font-weight: 650; }
.ask { margin-top: 8px; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(6px); transition: opacity .4s ease, transform .4s ease; }
.ask__label { margin-right: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--a-mut); }
.pill { border-radius: 8px; padding: 6px 13px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); color: var(--a-ink); background: #fff; }
.pill--go { background: var(--accent); border-color: var(--accent); color: #fff; }
.done-row { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--green); font-weight: 600; }
.done-row svg { width: 14px; height: 14px; }
.layer.show-result .result, .layer.show-result .ask { opacity: 1; transform: none; }
.layer.show-result .ask { transition-delay: .25s; }

/* case picker under the screen */
.picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px auto 0; padding: 6px; width: fit-content; max-width: 100%;
  background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line-soft); border-radius: 14px; }
.picker button { all: unset; cursor: pointer; position: relative; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 6px 11px; border-radius: 9px; transition: color .2s ease, background-color .2s ease; }
.picker button:hover { color: var(--text); background: rgba(20,24,34,.045); }
.picker button[aria-current="true"] { color: var(--accent); background: rgba(54,116,217,.09); }
.picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- Info card ---------- */
.tip { position: fixed; left: 0; top: 0; z-index: 50; width: 270px; pointer-events: none;
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 14px 36px -14px rgba(20,24,34,.28);
  opacity: 0; transform: translate3d(var(--tx,0), calc(var(--ty,0) + 6px), 0); transition: opacity .2s ease, transform .25s cubic-bezier(.2,.7,.2,1); }
.tip.is-on { opacity: 1; transform: translate3d(var(--tx,0), var(--ty,0), 0); }
.tip__title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.tip__title img, .tip__title svg { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; }
.tip__text { font-size: 13px; line-height: 1.5; color: var(--muted); }
.tip__hint { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 5px; }
.tip__hint:empty { display: none; }

/* ---------- Narrower desktops ---------- */
@media (max-width: 1180px) {
  .hero__inner { gap: 56px; padding: 64px 40px; grid-template-columns: minmax(300px, 1fr) minmax(460px, 540px); }
}
@media (max-width: 960px) and (min-width: 761px) {
  .hero__inner { grid-template-columns: 1fr 1fr; gap: 36px; padding: 56px 28px; }
  .stagebody { height: 520px; }
}

/* ---------- Mobile ---------- */
@media (max-width: 760px) {
  :root { --t: 54px; --gap: 10px; }
  .hero { height: auto; max-height: none; min-height: 0; }
  .hero__inner { display: block; height: auto; padding: 140px 16px 150px; }
  .copy { max-width: none; }
  .logo { width: 220px; margin-bottom: 22px; }
  .tagline { font-size: 2rem; }
  .sub { font-size: 1.02rem; margin-bottom: 24px; }
  .screen { margin-top: 76px; }
  .layer { padding: 14px 14px 16px; }
  .prompt { font-size: 13.5px; max-width: 92%; }
  .chrome .url { padding: 4px 26px; }
  .veil { background:
    linear-gradient(to bottom, rgba(251,251,250,0) 0, rgba(251,251,250,0) 120px, rgba(251,251,250,.9) 150px, rgba(251,251,250,.9) calc(100% - 180px), rgba(251,251,250,0) calc(100% - 150px)),
    linear-gradient(to bottom, rgba(251,251,250,0) calc(100% - 40px), var(--bg) 100%); }
  .wall__grid { transform: none; }
}

/* ---------- Reduced motion: no movement, fades only ---------- */
@media (prefers-reduced-motion: reduce) {
  .gloss { animation: none; display: none; }
  .tile, .tile.is-tracking { transition: none; transform: none !important; }
  .wall__grid { transform: none; }
  .step, .result, .ask { transform: none !important; transition: opacity .3s ease; }
  .st__spin { animation: none; }
  .tip { transition: opacity .15s ease; transform: translate3d(var(--tx,0), var(--ty,0), 0); }
  .btn--primary::after { display: none; }
}
</style>
</head>
<body>

<section class="hero" id="hero" aria-labelledby="hero-title">
  <div class="wall" id="wall" aria-label="Anbindungen von Kontexus">
    <div class="wall__grid" id="grid"></div>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <div class="hero__inner">
    <div class="copy" id="copy">
      <h1 id="hero-title">
        <svg class="logo kx-anim" viewBox="-319.657 -139.35 574.002 205.7" role="img" aria-label="Kontexus" style="overflow:visible;display:block">
          <defs>
            <linearGradient id="kxgrad-hero" gradientUnits="userSpaceOnUse" x1="-36" y1="-36" x2="36" y2="36">
              <stop offset="0" stop-color="#6B9FFF"/><stop offset="1" stop-color="#6BA5F2"/>
            </linearGradient>
            <radialGradient id="kxglow-hero"><stop offset="0" stop-color="#6B9FFF" stop-opacity="0.45"/><stop offset="1" stop-color="#6B9FFF" stop-opacity="0"/></radialGradient>
          </defs>
          <g transform="translate(44.77,-30.45) scale(1.28)">
            <circle class="kx-glow" cx="0" cy="0" r="26" fill="url(#kxglow-hero)"/>
          </g>
          <text class="kx-word kx-w1" x="-277.307" y="0">konte</text>
          <text class="kx-word kx-w2" x="96.8" y="0">us</text>
          <g transform="translate(44.77,-30.45) scale(1.28)">
            <g stroke="url(#kxgrad-hero)" stroke-width="9.67" stroke-linecap="round" fill="none">
              <line class="kx-arm" x1="15.322" y1="-15.322" x2="27.542" y2="-27.542"/>
              <line class="kx-arm" x1="15.322" y1="15.322" x2="27.542" y2="27.542"/>
              <line class="kx-arm" x1="-15.322" y1="15.322" x2="-27.542" y2="27.542"/>
              <line class="kx-arm" x1="-15.322" y1="-15.322" x2="-27.542" y2="-27.542"/>
            </g>
            <circle class="kx-dot" cx="0" cy="0" r="8.954" fill="url(#kxgrad-hero)"/>
          </g>
          <g transform="translate(44.77,-30.45) scale(1.28)">
            <circle class="kx-spark" data-sx="36" data-sy="-36" cx="0" cy="0" r="3.1" fill="#6B9FFF"/>
            <circle class="kx-spark" data-sx="36" data-sy="36" cx="0" cy="0" r="3.1" fill="#6B9FFF"/>
            <circle class="kx-spark" data-sx="-36" data-sy="36" cx="0" cy="0" r="3.1" fill="#6B9FFF"/>
            <circle class="kx-spark" data-sx="-36" data-sy="-36" cx="0" cy="0" r="3.1" fill="#6B9FFF"/>
          </g>
        </svg>
        <span class="tagline" style="display:block">Der KI-Arbeitsplatz <span class="grad">aus der Schweiz.</span></span>
      </h1>

      b.dataset.icon = icon;
      cell.textContent = '';
      cell.appendChild(b);
      (tilesByIcon[icon] = tilesByIcon[icon] || []).push(b);
    }
    if (swissIdx >= 0) fill(swissIdx, 'swiss');
    ORDER.forEach(function (icon, n) { if (chosen[n] != null) fill(chosen[n], icon); });
    grid.dataset.level = S.level;

    /* veil follows the text block */
    var vx = ((cr.left + cr.width * 0.42 - hr.left) / W * 100).toFixed(1) + '%';
    hero.style.setProperty('--vx', vx);
    hero.style.setProperty('--vy', ((cr.top + cr.height / 2 - hr.top) / H * 100).toFixed(1) + '%');
    hero.style.setProperty('--vw', Math.round(cr.width * 0.78 + 60) + 'px');
    hero.style.setProperty('--vh', Math.round(cr.height * 0.72 + 50) + 'px');
    applyLit();
  }

  /* ---------------- Lit state ---------------- */
  var litCase = null, litActive = null;
  function applyLit() {
    wall.classList.toggle('is-running', !!litCase);
    Object.keys(tilesByIcon).forEach(function (icon) {
      var inCase = !!litCase && litCase.connectors.indexOf(icon) >= 0;
      tilesByIcon[icon].forEach(function (b) {
        b.classList.toggle('is-case', inCase);
        b.classList.toggle('is-active', inCase && icon === litActive);
      });
    });
  }
  function light(c, active) { litCase = c; litActive = active || null; applyLit(); }

  /* ---------------- Clock (pausable) ---------------- */
  var clock = { ev: [], i: 0, el: 0, t0: 0, timer: 0, hidden: false };
  function clockRun(ev) {
    clearTimeout(clock.timer);
    clock.ev = ev.sort(function (a, b) { return a.at - b.at; });
    clock.i = 0; clock.el = 0; clock.t0 = performance.now();
    clockNext();
  }
  function now() { return clock.el + (clock.hidden ? 0 : performance.now() - clock.t0); }
  function clockNext() {
    clearTimeout(clock.timer);
    if (clock.hidden || clock.i >= clock.ev.length) return;
    clock.timer = setTimeout(clockTick, Math.max(0, clock.ev[clock.i].at - now()));
  }
  function clockTick() {
    var e = now(), list = clock.ev;
    while (clock.i < list.length && list[clock.i].at <= e + 4) {
      list[clock.i++].fn();
      /* an event (advance, or a click handler) started a new clock: stop here, the new run schedules itself */
      if (clock.ev !== list) return;
    }
    clockNext();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && !clock.hidden) { clock.el = now(); clock.hidden = true; clearTimeout(clock.timer); }
    else if (!document.hidden && clock.hidden) { clock.hidden = false; clock.t0 = performance.now(); clockNext(); }
  });

  /* ---------------- Screen ---------------- */
  function layerHTML(c) {
    var question = /\?$/.test(c.result);
    var steps = c.steps.map(function (s) {
      return '<li class="step"><img src="' + src(s[0]) + '" alt=""><div class="step__txt"><b>' + esc(s[1]) + '</b><span>' + esc(s[2]) + '</span></div>' +
        '<span class="st" aria-hidden="true"><span class="st__spin"></span>' + OK + '</span></li>';
    }).join('');
    var tail = question
      ? '<div class="ask"><span class="ask__label">Wartet auf Freigabe</span><span class="pill">Ablehnen</span><span class="pill pill--go">Zulassen</span></div>'
      : '<div class="ask"><span class="done-row"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.2" fill="#0f9d8a"/><path d="M4.8 8.2l2.1 2.1 4.3-4.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Fertig</span></div>';
    return '<div class="layer__top"><span class="casetag">' + esc(c.title) + '</span><span>Beispiel</span></div>' +
      '<div class="prompt">' + esc(c.prompt) + '</div>' +
      '<div class="agent"><span class="av">' + MARK + '</span><div class="agent__body"><div class="agent__name">Kontexus</div>' +
      '<ol class="steps">' + steps + '</ol><p class="result">' + bold(c.result) + '</p>' + tail + '</div></div>';
  }

  function sizeBody() {
    var probes = CASES.map(function (c) {
      var p = document.createElement('div'); p.className = 'layer is-probe show-result'; p.setAttribute('aria-hidden', 'true');
      p.innerHTML = layerHTML(c); p.querySelectorAll('.step').forEach(function (s) { s.classList.add('on', 'done'); });
      body.appendChild(p); return p;
    });
    var h = 0; probes.forEach(function (p) { h = Math.max(h, p.offsetHeight); });
    probes.forEach(function (p) { p.remove(); });
    body.style.height = Math.ceil(h + 4) + 'px';
  }

  var current = null, featIdx = -1, hoverScreen = false, waitingNext = false;
  var STEP_GAP = 680, STEP_DONE = 520, FIRST = 520, HOLD = 3200;

  function play(c) {
    current = c;
    var fi = FEATURED.indexOf(c); if (fi >= 0) featIdx = fi;
    picker.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', String(b.dataset.id === c.id)); });

    var old = body.querySelectorAll('.layer:not(.is-probe)');
    old.forEach(function (o) { o.classList.remove('is-in'); setTimeout(function () { o.remove(); }, 520); });
    var L = document.createElement('div'); L.className = 'layer'; L.innerHTML = layerHTML(c);
    body.appendChild(L);
    var steps = L.querySelectorAll('.step');
    requestAnimationFrame(function () { requestAnimationFrame(function () { L.classList.add('is-in'); }); });

    var ev = [];
    if (reduced) {
      steps.forEach(function (s) { s.classList.add('on', 'done'); });
      L.classList.add('show-result');
      light(c, null);
      ev.push({ at: 7000, fn: advance });
    } else {
      light(c, null);
      var at = FIRST;
      c.steps.forEach(function (s, i) {
        var a = at;
        ev.push({ at: a, fn: function () { steps[i].classList.add('on', 'running'); light(c, s[0]); } });
        ev.push({ at: a + STEP_DONE, fn: function () { steps[i].classList.remove('running'); steps[i].classList.add('done'); } });
        at += STEP_GAP;
      });
      var tr = at - STEP_GAP + STEP_DONE + 320;
      ev.push({ at: tr, fn: function () { L.classList.add('show-result'); light(c, null); } });
      ev.push({ at: tr + HOLD, fn: advance });
    }
    clockRun(ev);
  }

  function advance() {
    if (hoverScreen) { waitingNext = true; return; }
    waitingNext = false;
    play(FEATURED[(featIdx + 1) % FEATURED.length]);
  }

  screen.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') hoverScreen = true; });
  screen.addEventListener('pointerleave', function () {
    hoverScreen = false;
    if (waitingNext) { waitingNext = false; clockRun([{ at: 900, fn: advance }]); }
  });

  FEATURED.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = c.title; b.dataset.id = c.id;
    b.addEventListener('click', function () { waitingNext = false; play(c); });
    picker.appendChild(b);
  });

  /* ---------------- Tile interaction ---------------- */
  function pickCase(icon) {
    var list = casesFor(icon); if (!list.length) return null;
    var at = current ? list.indexOf(current) : -1;
    return at >= 0 ? list[(at + 1) % list.length] : list[0];
  }
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.tile'); if (!b) return;
    var icon = b.dataset.icon; if (icon === 'swiss') return;
    var c = pickCase(icon); if (!c) return;
    waitingNext = false;
    play(c);
  });

  var tipFor = null;
  function showTip(b) {
    tipFor = b;
    var icon = b.dataset.icon, t = icon === 'swiss' ? SWISS : TIPS[icon];
    $('tipTitle').innerHTML = (icon === 'swiss' ? FLAG : '<img src="' + src(icon) + '" alt="">') + '<span>' + esc(t[0]) + '</span>';
    $('tipText').textContent = t[1];
    $('tipText').style.display = t[1] ? '' : 'none';
    $('tipHint').textContent = icon !== 'swiss' && casesFor(icon).length ? 'Klicken für ein Beispiel →' : '';
    var r = b.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var x = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), vw - tw - 12);
    var y = r.top - th - 12;
    if (y < 12) y = r.bottom + 12;
    if (y + th > vh - 12) y = Math.max(12, vh - th - 12);
    tip.style.setProperty('--tx', Math.round(x) + 'px');
    tip.style.setProperty('--ty', Math.round(y) + 'px');
    tip.classList.add('is-on');
  }
  function hideTip(b) { if (b && b !== tipFor) return; tipFor = null; tip.classList.remove('is-on'); }

  grid.addEventListener('pointerover', function (e) { var b = e.target.closest('.tile'); if (b && b !== tipFor) showTip(b); });
  grid.addEventListener('pointerout', function (e) {
    var b = e.target.closest('.tile'); if (!b || b.contains(e.relatedTarget)) return;
    hideTip(b); b.classList.remove('is-tracking'); b.style.removeProperty('--rx'); b.style.removeProperty('--ry');
  });
  grid.addEventListener('focusin', function (e) { var b = e.target.closest('.tile'); if (b) showTip(b); });
  grid.addEventListener('focusout', function (e) { var b = e.target.closest('.tile'); if (b) hideTip(b); });
  window.addEventListener('scroll', function () { hideTip(); }, { passive: true });

  /* gentle tilt toward the cursor, one write per frame */
  if (!reduced) {
    var pend = null, raf = 0;
    grid.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      var b = e.target.closest('.tile'); if (!b) return;
      pend = { b: b, x: e.clientX, y: e.clientY };
      if (!raf) raf = requestAnimationFrame(function () {
        raf = 0; if (!pend) return;
        var r = pend.b.getBoundingClientRect();
        var px = (pend.x - r.left) / r.width - 0.5, py = (pend.y - r.top) / r.height - 0.5;
        pend.b.classList.add('is-tracking');
        pend.b.style.setProperty('--ry', (px * 18).toFixed(2) + 'deg');
        pend.b.style.setProperty('--rx', (-py * 18).toFixed(2) + 'deg');
        pend = null;
      });
    });
  }

  /* ---------------- Init ---------------- */
  function layout() { sizeBody(); buildWall(); }
  var rt = 0;
  var lastH = 0;
  function sizeChanged() { return hero.clientWidth !== lastW || Math.abs(hero.clientHeight - lastH) > 2; }
  function onResize() {
    clearTimeout(rt); rt = setTimeout(function () {
      if (!sizeChanged()) return;
      lastW = hero.clientWidth; lastH = hero.clientHeight; hideTip(); layout();
    }, 120);
  }
  window.addEventListener('resize', onResize);
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(hero);

  /* test hook for headless screenshots: #vh=900 pins the hero height */
  var vhm = /vh=(\d+)/.exec(location.hash);
  if (vhm) { hero.style.height = vhm[1] + 'px'; hero.style.minHeight = '0'; hero.style.maxHeight = 'none'; }
  lastW = hero.clientWidth; lastH = hero.clientHeight;
  sizeBody();
  play(FEATURED[0]);
  buildWall();
  var fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();
  fontsReady.then(function () { lastW = hero.clientWidth; lastH = hero.clientHeight; layout(); });
})();

// Kontexus animated lockup — the "Flow" reveal (port of AnimatedLogo.tsx).
// Arms draw from the outside in, a spark glides along each into the core, the
// dot blooms, then the wordmark settles in. Plays once when it scrolls in.
(function () {
  var svg = document.querySelector('.kx-anim');
  if (!svg || typeof svg.animate !== 'function') return; // no WAAPI -> CSS shows final frame
  var arms = [].slice.call(svg.querySelectorAll('.kx-arm'));
  var sparks = [].slice.call(svg.querySelectorAll('.kx-spark'));
  var dot = svg.querySelector('.kx-dot');
  var glow = svg.querySelector('.kx-glow');
  var words = [].slice.call(svg.querySelectorAll('.kx-word'));
  var ARM_DELAYS = [120, 260, 200, 330];
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = [];

  function A(el, frames, opts) {
    opts.fill = 'both';
    if (!opts.easing) opts.easing = 'cubic-bezier(.4,0,.2,1)';
    var a = el.animate(frames, opts);
    running.push(a);
    return a;
  }

  function play() {
    running.splice(0).forEach(function (a) { a.cancel(); });
    if (reduced) return; // CSS default already is the final frame

    arms.forEach(function (el, i) {
      A(el, [
        { strokeDashoffset: '-18px', opacity: 0 },
        { strokeDashoffset: '-18px', opacity: 1, offset: 0.06 },
        { strokeDashoffset: '0px', opacity: 1 }
      ], { duration: 640, delay: ARM_DELAYS[i], easing: 'cubic-bezier(.3,.6,.15,1)' });
    });

    sparks.forEach(function (el, i) {
      var sx = el.getAttribute('data-sx'), sy = el.getAttribute('data-sy');
      A(el, [
        { transform: 'translate(' + sx + 'px,' + sy + 'px)', opacity: 0 },
        { opacity: 1, offset: 0.14 },
        { opacity: 0.95, offset: 0.8 },
        { transform: 'translate(0px,0px)', opacity: 0 }
      ], { duration: 740, delay: ARM_DELAYS[i], easing: 'cubic-bezier(.5,.05,.3,1)' });
    });

    if (glow) A(glow, [
      { opacity: 0, transform: 'scale(.5)' },
      { opacity: 0.85, offset: 0.35 },
      { opacity: 0, transform: 'scale(1.5)' }
    ], { duration: 700, delay: 1030, easing: 'cubic-bezier(.25,.6,.3,1)' });

    if (dot) A(dot, [
      { opacity: 0, transform: 'scale(.25)' },
      { opacity: 1, offset: 0.45 },
      { transform: 'scale(1.12)', offset: 0.62 },
      { transform: 'scale(1)', opacity: 1 }
    ], { duration: 540, delay: 1030, easing: 'cubic-bezier(.2,.7,.25,1)' });

    if (words[0]) A(words[0], [
      { opacity: 0, transform: 'translateX(9px)' },
      { opacity: 1, transform: 'translateX(0px)' }
    ], { duration: 620, delay: 1160, easing: 'cubic-bezier(.2,.7,.2,1)' });

    if (words[1]) A(words[1], [
      { opacity: 0, transform: 'translateX(-9px)' },
      { opacity: 1, transform: 'translateX(0px)' }
    ], { duration: 620, delay: 1160, easing: 'cubic-bezier(.2,.7,.2,1)' });
  }

  var played = false;
  function start() {
    if (played) return;
    played = true;
    Promise.race([
      (document.fonts && document.fonts.ready) || Promise.resolve(),
      new Promise(function (r) { setTimeout(r, 700); })
    ]).then(function () { requestAnimationFrame(play); });
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { start(); io.disconnect(); }
      });
    }, { threshold: 0.4 });
    io.observe(svg);
  } else {
    start();
  }
})();
</script>
</body>
</html>
